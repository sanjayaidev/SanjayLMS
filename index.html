<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
    <title>LMS Platform · Explore Courses</title>
    <!-- Font Awesome for icons (optional but used in footer) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ----- reset & base ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0b0a12;
            --surface: #15131f;
            --card-bg: #1c1a2b;
            --border: #2e2a42;
            --text: #e7e2f5;
            --text-dim: #a8a3bd;
            --accent: #7c6df0;
            --accent-light: #b5a9ff;
            --gradient-start: #667eea;
            --gradient-end: #764ba2;
            --radius: 1rem;
            --shadow: 0 12px 30px rgba(0,0,0,0.6);
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.5;
            padding-top: 80px; /* header space */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ----- header (mobile‑first) ----- */
        .main-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(11, 10, 18, 0.88);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 0.6rem 1rem;
            z-index: 100;
            display: flex;
            align-items: center;
            min-height: 68px;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .logo h1 {
            font-size: 1.25rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.02em;
            white-space: nowrap;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 0.4rem 0.8rem;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        /* buttons & states */
        .cta-button {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 2.5rem;
            padding: 0.5rem 1.2rem;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            text-decoration: none;
            text-align: center;
            white-space: nowrap;
        }

        .cta-button.small {
            padding: 0.35rem 1rem;
            font-size: 0.8rem;
        }

        .cta-button:hover {
            background: #8f7ff5;
            transform: scale(0.97);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.35rem 1rem;
            border-radius: 2.5rem;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            display: inline-block;
            white-space: nowrap;
        }

        .btn-secondary:hover {
            background: var(--border);
            color: #fff;
        }

        .user-email {
            font-size: 0.75rem;
            opacity: 0.8;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: inline-block;
        }

        #loggedOutActions,
        #loggedInActions {
            display: flex;
            align-items: center;
            gap: 0.4rem 0.6rem;
            flex-wrap: wrap;
        }

        /* hide login button on very small screens? we keep it visible – but we make it responsive */
        /* ensure it never disappears – we just adjust size */

        /* ----- hero ----- */
        .hero {
            background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
            padding: 2.5rem 1.5rem;
            text-align: center;
            color: white;
        }

        .hero h1 {
            font-size: 2rem;
            margin-bottom: 0.4rem;
        }
        .hero p {
            opacity: 0.9;
            font-size: 1rem;
        }

        /* ----- catalog grid ----- */
        .catalog-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.5rem 1rem 3rem;
            width: 100%;
            flex: 1;
        }

        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.8rem;
            margin-top: 0.5rem;
        }

        /* course card */
        .course-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            height: 100%;
            box-shadow: var(--shadow);
        }

        .course-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
        }

        .course-image {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: linear-gradient(135deg, rgba(255,107,53,0.2), rgba(255,255,255,0.04));
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .course-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .course-image .placeholder-icon {
            font-size: 3.2rem;
            opacity: 0.5;
        }

        .course-card-body {
            padding: 1.2rem 1rem 1.2rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .course-card-body h3 {
            font-size: 1.1rem;
            margin-bottom: 0.4rem;
            line-height: 1.3;
        }

        .course-desc {
            color: var(--text-dim);
            font-size: 0.9rem;
            line-height: 1.5;
            flex: 1;
            margin-bottom: 0.8rem;
        }

        .course-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 0.3rem 0 0.8rem;
            font-size: 0.8rem;
            flex-wrap: wrap;
            gap: 0.3rem;
        }

        .course-tier {
            background: #2a2542;
            padding: 0.2rem 0.7rem;
            border-radius: 2rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            font-size: 0.7rem;
            color: var(--accent-light);
        }

        .course-price {
            font-weight: 700;
            font-size: 1.2rem;
            color: #d4caff;
        }

        .course-actions {
            display: flex;
            gap: 0.6rem;
            margin-top: 0.6rem;
            flex-wrap: wrap;
        }

        .course-actions .cta-button {
            flex: 1 1 auto;
            min-width: 90px;
            padding: 0.5rem 0.8rem;
            font-size: 0.8rem;
        }

        .btn-know-more {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dim);
        }

        .btn-know-more:hover {
            background: var(--border);
            color: #fff;
        }

        .btn-know-more[disabled] {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }

        .btn-buy-now {
            background: var(--accent);
        }

        .btn-buy-now:hover {
            background: #8f7ff5;
        }

        /* empty & loading */
        .loading-state, .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-dim);
        }

        /* footer */
        footer {
            max-width: 1080px;
            margin: 2rem auto 0;
            padding: 1.5rem 1rem;
            border-top: 1px solid rgba(255,255,255,0.06);
            width: 100%;
        }

        footer nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.3rem 1.8rem;
            font-size: 0.8rem;
        }

        footer a {
            color: var(--text-dim);
            text-decoration: none;
            transition: color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        footer a:hover {
            color: var(--accent-light);
            text-decoration: underline;
        }

        footer p {
            color: var(--text-dim);
            font-size: 0.7rem;
            opacity: 0.5;
            margin-top: 1rem;
            text-align: center;
        }

        /* ----- mobile adjustments (all screens) ----- */
        @media (max-width: 640px) {
            body { padding-top: 70px; }

            .main-header {
                padding: 0.4rem 0.8rem;
                min-height: 60px;
            }

            .logo h1 {
                font-size: 1rem;
            }

            .user-info {
                gap: 0.2rem 0.4rem;
            }

            .cta-button.small {
                padding: 0.25rem 0.7rem;
                font-size: 0.7rem;
            }

            .btn-secondary {
                padding: 0.25rem 0.7rem;
                font-size: 0.7rem;
            }

            .user-email {
                max-width: 80px;
                font-size: 0.65rem;
            }

            .hero {
                padding: 1.8rem 1rem;
            }
            .hero h1 { font-size: 1.6rem; }
            .hero p { font-size: 0.9rem; }

            .catalog-content {
                padding: 1rem 0.6rem 2rem;
            }

            .courses-grid {
                grid-template-columns: 1fr 1fr;
                gap: 1rem;
            }

            .course-card-body {
                padding: 0.9rem 0.7rem 1rem;
            }

            .course-card-body h3 {
                font-size: 0.95rem;
            }
            .course-desc {
                font-size: 0.8rem;
            }
            .course-price {
                font-size: 1rem;
            }
            .course-actions .cta-button {
                font-size: 0.7rem;
                padding: 0.35rem 0.5rem;
                min-width: 70px;
            }
            .course-tier {
                font-size: 0.6rem;
                padding: 0.1rem 0.6rem;
            }
        }

        @media (max-width: 440px) {
            .courses-grid {
                grid-template-columns: 1fr;
                max-width: 380px;
                margin-left: auto;
                margin-right: auto;
            }
            .header-content {
                gap: 0.3rem;
            }
            .logo h1 {
                font-size: 0.9rem;
            }
            .user-email {
                max-width: 60px;
            }
            .cta-button.small {
                padding: 0.2rem 0.6rem;
                font-size: 0.65rem;
            }
            .btn-secondary {
                padding: 0.2rem 0.6rem;
                font-size: 0.65rem;
            }
        }

        /* ensure login button is never hidden – it's always visible */
        #loggedOutActions .login-btn {
            display: inline-block;
        }

        /* fix for flex wrap on very small screens */
        .user-info {
            flex-wrap: wrap;
        }
        #loggedInActions {
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="main-header">
        <div class="header-content">
            <a href="/" class="logo" style="text-decoration:none;">
                <h1>📚 LMS Platform</h1>
            </a>
            <div class="user-info">
                <!-- Logged-out state -->
                <div id="loggedOutActions">
                    <a href="login.html" class="cta-button small login-btn">Login</a>
                </div>
                <!-- Logged-in state -->
                <div id="loggedInActions" style="display: none; align-items: center; gap: 0.4rem 0.6rem; flex-wrap: wrap;">
                    <span class="user-email" id="userEmail"></span>
                    <a href="my-courses.html" class="btn-secondary">My Courses</a>
                    <button id="logoutBtn" class="btn-secondary">Logout</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Hero -->
    <section class="hero">
        <h1>Explore Our Courses</h1>
        <p>Browse the full catalog. Log in to purchase and start learning.</p>
    </section>

    <!-- Catalog -->
    <main class="catalog-content">
        <div id="loadingState" class="loading-state">Loading courses…</div>
        <div id="emptyState" class="empty-state" style="display: none;">
            <h2>No courses available right now</h2>
            <p>Please check back soon.</p>
        </div>
        <div id="coursesContainer" class="courses-grid"></div>
    </main>

    <!-- Footer -->
    <footer>
        <div style="display: flex; flex-direction: column; gap: 0.8rem; align-items: center;">
            <nav>
                <a href="/privacy.html"><i class="fas fa-shield-halved"></i> Privacy Policy</a>
                <a href="/refund.html"><i class="fas fa-rotate-left"></i> Refund Policy</a>
                <a href="/terms.html"><i class="fas fa-file-lines"></i> Terms of Service</a>
            </nav>
            <p>© 2026 Sanjay Meher</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script>
        // Backend Configuration (kept as original)
        window.LMS_CONFIG = {
            SUPABASE_URL: 'https://bvavtdyxuzzabzgodbjw.supabase.co',
            SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ2YXZ0ZHl4dXp6YWJ6Z29kYmp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxOTc2OTksImV4cCI6MjA4OTc3MzY5OX0.gqfiaeDtWBtuyj_CQCaiySVA2-VmuM9CVvd5N-gRlV8',
            API_BASE_URL: '/api',
            USE_PRISMA_API: false
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- auth-manager.js & router.js are expected to be present; we provide stubs if missing -->
    <script>
        // Stub for auth-manager and router if not loaded (to avoid breaking)
        if (typeof window.AuthManager === 'undefined' && typeof window.authManager === 'undefined') {
            window.authManager = {
                init: async () => {},
                refreshSession: async () => {
                    const { data } = await window.supabase.auth.getSession();
                    return data.session;
                },
                signOut: async () => {
                    await window.supabase.auth.signOut();
                }
            };
            window.AuthManager = window.authManager;
        }
        if (typeof window.lmsRouter === 'undefined') {
            window.lmsRouter = {
                navigate: (path) => { window.location.href = path; }
            };
        }
    </script>
    <script>
        // Main Catalog class (functionally identical, but with responsive styles already)
        class CatalogPage {
            constructor() {
                this.courses = [];
                this.init();
            }

            async init() {
                await this.checkAuthState();
                await this.loadCourses();
                this.renderCourses();
                this.setupEventListeners();
            }

            async checkAuthState() {
                const authManager = window.AuthManager || window.authManager;
                let session = null;
                try {
                    if (authManager && typeof authManager.init === 'function') {
                        await authManager.init();
                    }
                    if (authManager && typeof authManager.refreshSession === 'function') {
                        session = await authManager.refreshSession();
                    } else if (window.supabase) {
                        const { data } = await window.supabase.auth.getSession();
                        session = data.session;
                    }
                } catch (error) {
                    console.error('Error checking auth state:', error);
                }

                const loggedOutActions = document.getElementById('loggedOutActions');
                const loggedInActions = document.getElementById('loggedInActions');

                if (session && session.user) {
                    loggedOutActions.style.display = 'none';
                    loggedInActions.style.display = 'flex';
                    document.getElementById('userEmail').textContent = session.user.email;
                } else {
                    loggedOutActions.style.display = 'block';
                    loggedInActions.style.display = 'none';
                }
            }

            async loadCourses() {
                try {
                    const { data, error } = await window.supabase
                        .from('courses')
                        .select('*')
                        .eq('is_active', true)
                        .order('created_at');
                    if (error) throw error;
                    this.courses = data || [];
                } catch (error) {
                    console.error('Error loading courses:', error);
                    this.courses = [];
                }
            }

            renderCourses() {
                document.getElementById('loadingState').style.display = 'none';
                const container = document.getElementById('coursesContainer');
                const emptyState = document.getElementById('emptyState');

                if (this.courses.length === 0) {
                    container.style.display = 'none';
                    emptyState.style.display = 'block';
                    return;
                }
                container.style.display = 'grid';
                emptyState.style.display = 'none';
                container.innerHTML = this.courses.map(course => this.renderCourseCard(course)).join('');
            }

            renderCourseCard(course) {
                const description = course.description || '';
                const shortDesc = description.length > 110 ? description.substring(0, 110) + '...' : description;
                const priceLabel = (course.price === null || course.price === undefined || course.price === 0) ? 'Free' : `₹${Number(course.price).toFixed(2)}`;
                const imageMarkup = course.thumbnail_url
                    ? `<img src="${this.escapeAttr(course.thumbnail_url)}" alt="${this.escapeAttr(course.title)}" loading="lazy">`
                    : `<span class="placeholder-icon">📘</span>`;

                const knowMoreMarkup = course.know_more_url
                    ? `<a class="cta-button secondary btn-know-more" href="${this.escapeAttr(course.know_more_url)}" target="_blank" rel="noopener noreferrer">Know More</a>`
                    : `<button class="cta-button secondary btn-know-more" disabled title="Details coming soon">Know More</button>`;

                return `
                    <div class="course-card">
                        <div class="course-image">${imageMarkup}</div>
                        <div class="course-card-body">
                            <h3>${this.escapeHtml(course.title)}</h3>
                            <p class="course-desc">${this.escapeHtml(shortDesc)}</p>
                            <div class="course-meta">
                                <span class="course-tier">${(course.required_tier || 'basic').toUpperCase()} TIER</span>
                                <span class="course-price">${priceLabel}</span>
                            </div>
                            <div class="course-actions">
                                ${knowMoreMarkup}
                                <button class="cta-button btn-buy-now" data-course-id="${this.escapeAttr(course.id)}">Buy Now</button>
                            </div>
                        </div>
                    </div>
                `;
            }

            setupEventListeners() {
                document.getElementById('coursesContainer').addEventListener('click', (e) => {
                    const buyBtn = e.target.closest('.btn-buy-now');
                    if (buyBtn) {
                        this.goToCheckout(buyBtn.dataset.courseId);
                    }
                });
                const logoutBtn = document.getElementById('logoutBtn');
                if (logoutBtn) {
                    logoutBtn.addEventListener('click', () => this.logout());
                }
            }

            goToCheckout(courseId) {
                const path = `/checkout?course=${encodeURIComponent(courseId)}`;
                if (window.lmsRouter && typeof window.lmsRouter.navigate === 'function') {
                    window.lmsRouter.navigate(path);
                } else {
                    window.location.href = path;
                }
            }

            async logout() {
                const authManager = window.AuthManager || window.authManager;
                if (authManager && typeof authManager.signOut === 'function') {
                    await authManager.signOut();
                } else if (window.supabase) {
                    await window.supabase.auth.signOut();
                }
                window.location.href = '/';
            }

            escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str ?? '';
                return div.innerHTML;
            }

            escapeAttr(str) {
                return this.escapeHtml(str).replace(/"/g, '&quot;');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            window.catalogPage = new CatalogPage();
        });
    </script>
</body>
