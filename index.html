<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS Platform - Explore Courses</title>
    <link rel="stylesheet" href="lms.css">
    <style>
        body { padding-top: 80px; }

        .hero {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 3.5rem 2rem;
            text-align: center;
            color: white;
        }

        .hero h1 {
            margin: 0 0 0.5rem 0;
            font-size: 2.4rem;
        }

        .hero p {
            margin: 0;
            opacity: 0.9;
            font-size: 1.05rem;
        }

        .catalog-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2.5rem 2rem 4rem;
        }

        .course-card {
            display: flex;
            flex-direction: column;
            padding: 0;
            overflow: hidden;
        }

        .course-image {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: linear-gradient(135deg, rgba(255,107,53,0.25), rgba(255,255,255,0.05));
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .course-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .course-image .placeholder-icon {
            font-size: 3rem;
            opacity: 0.6;
        }

        .course-card-body {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .course-card-body h3 {
            margin: 0 0 0.6rem 0;
        }

        .course-card-body .course-desc {
            color: var(--light);
            opacity: 0.85;
            font-size: 0.95rem;
            line-height: 1.5;
            flex: 1;
        }

        .course-price {
            font-size: 1.3rem;
        }

        .empty-state, .loading-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--light);
            opacity: 0.8;
        }

        .btn-know-more[disabled] {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .login-btn {
            display: inline-block;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="main-header">
        <div class="header-content">
            <a href="/" class="logo" style="text-decoration:none;">
                <h1>📚 LMS Platform</h1>
            </a>
            <div class="user-info">
                <!-- Logged-out state -->
                <div id="loggedOutActions">
                    <a href="login.html" class="cta-button small login-btn">Login</a>
                </div>
                <!-- Logged-in state -->
                <div id="loggedInActions" style="display: none; align-items: center; gap: 1rem;">
                    <span class="user-email" id="userEmail"></span>
                    <a href="my-courses.html" class="btn-secondary">My Courses</a>
                    <button id="logoutBtn" class="btn-secondary">Logout</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Hero -->
    <section class="hero">
        <h1>Explore Our Courses</h1>
        <p>Browse the full catalog. Log in to purchase and start learning.</p>
    </section>

    <!-- Catalog -->
    <main class="catalog-content">
        <div id="loadingState" class="loading-state">Loading courses…</div>

        <div id="emptyState" class="empty-state" style="display: none;">
            <h2>No courses available right now</h2>
            <p>Please check back soon.</p>
        </div>

        <div id="coursesContainer" class="courses-grid"></div>
    </main>

    <!-- Load Scripts -->
    <script>
        // Backend Configuration
        window.LMS_CONFIG = {
            SUPABASE_URL: 'https://bvavtdyxuzzabzgodbjw.supabase.co',
            SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ2YXZ0ZHl4dXp6YWJ6Z29kYmp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxOTc2OTksImV4cCI6MjA4OTc3MzY5OX0.gqfiaeDtWBtuyj_CQCaiySVA2-VmuM9CVvd5N-gRlV8',
            API_BASE_URL: '/api',
            USE_PRISMA_API: false
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth-manager.js"></script>
    <script src="router.js"></script>
    <script>
        class CatalogPage {
            constructor() {
                this.courses = [];
                this.init();
            }

            async init() {
                await this.checkAuthState();
                await this.loadCourses();
                this.renderCourses();
                this.setupEventListeners();
            }

            async checkAuthState() {
                const authManager = window.AuthManager || window.authManager;
                let session = null;

                try {
                    if (authManager && typeof authManager.init === 'function') {
                        await authManager.init();
                    }
                    if (authManager && typeof authManager.refreshSession === 'function') {
                        session = await authManager.refreshSession();
                    } else if (window.supabase) {
                        const { data } = await window.supabase.auth.getSession();
                        session = data.session;
                    }
                } catch (error) {
                    console.error('Error checking auth state:', error);
                }

                const loggedOutActions = document.getElementById('loggedOutActions');
                const loggedInActions = document.getElementById('loggedInActions');

                if (session && session.user) {
                    loggedOutActions.style.display = 'none';
                    loggedInActions.style.display = 'flex';
                    document.getElementById('userEmail').textContent = session.user.email;
                } else {
                    loggedOutActions.style.display = 'block';
                    loggedInActions.style.display = 'none';
                }
            }

            async loadCourses() {
                try {
                    const { data, error } = await window.supabase
                        .from('courses')
                        .select('*')
                        .eq('is_active', true)
                        .order('created_at');

                    if (error) throw error;
                    this.courses = data || [];
                } catch (error) {
                    console.error('Error loading courses:', error);
                    this.courses = [];
                }
            }

            renderCourses() {
                document.getElementById('loadingState').style.display = 'none';

                const container = document.getElementById('coursesContainer');
                const emptyState = document.getElementById('emptyState');

                if (this.courses.length === 0) {
                    container.style.display = 'none';
                    emptyState.style.display = 'block';
                    return;
                }

                container.style.display = 'grid';
                emptyState.style.display = 'none';

                container.innerHTML = this.courses.map(course => this.renderCourseCard(course)).join('');
            }

            renderCourseCard(course) {
                const description = course.description || '';
                const shortDesc = description.length > 110
                    ? description.substring(0, 110) + '...'
                    : description;

                const priceLabel = (course.price === null || course.price === undefined || course.price === 0)
                    ? 'Free'
                    : `₹${Number(course.price).toFixed(2)}`;

                const imageMarkup = course.thumbnail_url
                    ? `<img src="${this.escapeAttr(course.thumbnail_url)}" alt="${this.escapeAttr(course.title)}" loading="lazy">`
                    : `<span class="placeholder-icon">📘</span>`;

                const knowMoreMarkup = course.know_more_url
                    ? `<a class="cta-button secondary btn-know-more" href="${this.escapeAttr(course.know_more_url)}" target="_blank" rel="noopener noreferrer">Know More</a>`
                    : `<button class="cta-button secondary btn-know-more" disabled title="Details coming soon">Know More</button>`;

                return `
                    <div class="course-card">
                        <div class="course-image">${imageMarkup}</div>
                        <div class="course-card-body">
                            <h3>${this.escapeHtml(course.title)}</h3>
                            <p class="course-desc">${this.escapeHtml(shortDesc)}</p>
                            <div class="course-meta">
                                <span class="course-tier">${(course.required_tier || 'basic').toUpperCase()} TIER</span>
                                <span class="course-price">${priceLabel}</span>
                            </div>
                            <div class="course-actions">
                                ${knowMoreMarkup}
                                <button class="cta-button btn-buy-now" data-course-id="${this.escapeAttr(course.id)}">Buy Now</button>
                            </div>
                        </div>
                    </div>
                `;
            }

            setupEventListeners() {
                document.getElementById('coursesContainer').addEventListener('click', (e) => {
                    const buyBtn = e.target.closest('.btn-buy-now');
                    if (buyBtn) {
                        this.goToCheckout(buyBtn.dataset.courseId);
                    }
                });

                const logoutBtn = document.getElementById('logoutBtn');
                if (logoutBtn) {
                    logoutBtn.addEventListener('click', () => this.logout());
                }
            }

            goToCheckout(courseId) {
                // Checkout is a protected route -- if the visitor isn't logged in,
                // the router will bounce them to /login.html?redirect=... and bring
                // them right back here to complete the purchase after signing in.
                const path = `/checkout?course=${encodeURIComponent(courseId)}`;
                if (window.lmsRouter && typeof window.lmsRouter.navigate === 'function') {
                    window.lmsRouter.navigate(path);
                } else {
                    window.location.href = path;
                }
            }

            async logout() {
                const authManager = window.AuthManager || window.authManager;
                if (authManager && typeof authManager.signOut === 'function') {
                    await authManager.signOut();
                } else if (window.supabase) {
                    await window.supabase.auth.signOut();
                }
                window.location.href = '/';
            }

            escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str ?? '';
                return div.innerHTML;
            }

            escapeAttr(str) {
                return this.escapeHtml(str).replace(/"/g, '&quot;');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            window.catalogPage = new CatalogPage();
        });
    </script>
</body>
</html>
