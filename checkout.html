<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - LMS Platform</title>
    <link rel="stylesheet" href="lms.css">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        .checkout-page {
            max-width: 560px;
            margin: 3rem auto;
            padding: 0 1.5rem;
        }
        .checkout-card {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        .checkout-course {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #eee;
        }
        .checkout-course h2 { margin: 0 0 0.25rem 0; font-size: 1.2rem; }
        .checkout-course .price { font-size: 1.6rem; font-weight: 700; color: #667eea; }
        .provider-options { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.5rem; }
        .provider-option {
            display: flex; align-items: center; gap: 0.75rem;
            border: 2px solid #eee; border-radius: 10px; padding: 1rem;
            cursor: pointer; transition: border-color .15s;
        }
        .provider-option.selected { border-color: #667eea; background: #f5f6ff; }
        .provider-option input { margin: 0; }
        .provider-option .label { font-weight: 600; }
        .provider-option .sub { font-size: 0.8rem; color: #888; }
        .pay-btn {
            width: 100%; padding: 0.9rem; border: none; border-radius: 10px;
            background: #667eea; color: white; font-size: 1rem; font-weight: 600;
            cursor: pointer;
        }
        .pay-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .checkout-error { color: #d33; font-size: 0.9rem; margin-top: 1rem; text-align: center; }
        .checkout-loading { text-align: center; padding: 3rem 0; color: #888; }
    </style>
</head>
<body>
    <div class="checkout-page">
        <div class="checkout-card">
            <div id="checkoutLoading" class="checkout-loading">Loading course details…</div>

            <div id="checkoutBody" style="display:none;">
                <div class="checkout-course">
                    <div>
                        <h2 id="courseTitle"></h2>
                        <div style="color:#888; font-size:0.85rem;">One-time purchase</div>
                    </div>
                    <div class="price" id="coursePrice"></div>
                </div>

                <div class="provider-options">
                    <label class="provider-option selected" data-provider="razorpay">
                        <input type="radio" name="provider" value="razorpay" checked>
                        <div>
                            <div class="label">Razorpay</div>
                            <div class="sub">UPI, Cards, NetBanking, Wallets</div>
                        </div>
                    </label>
                    <label class="provider-option" data-provider="paypal">
                        <input type="radio" name="provider" value="paypal">
                        <div>
                            <div class="label">PayPal</div>
                            <div class="sub">PayPal balance, Credit/Debit card</div>
                        </div>
                    </label>
                </div>

                <button class="pay-btn" id="payBtn" onclick="startPayment()">Pay Now</button>
                <div class="checkout-error" id="checkoutError" style="display:none;"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        window.LMS_CONFIG = {
            SUPABASE_URL: 'https://dawxhfdvozykhxkzpfbv.supabase.co',
            SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRhd3hoZmR2b3p5a2h4a3pwZmJ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1MTgyMzAsImV4cCI6MjA5OTA5NDIzMH0.MiGLrpu3i-5u9hyQrdyBFm9J5pb689Oe21eUsKUjbyU'
        };

        const supabaseClient = window.supabase.createClient(
            window.LMS_CONFIG.SUPABASE_URL,
            window.LMS_CONFIG.SUPABASE_ANON_KEY
        );

        const params   = new URLSearchParams(location.search);
        const courseId = params.get('course');
        let course = null;
        let session = null;

        document.querySelectorAll('.provider-option').forEach(el => {
            el.addEventListener('click', () => {
                document.querySelectorAll('.provider-option').forEach(o => o.classList.remove('selected'));
                el.classList.add('selected');
                el.querySelector('input').checked = true;
                if (course) updatePriceDisplay();
            });
        });

        function selectedProvider() {
            return document.querySelector('input[name="provider"]:checked').value;
        }

        function showError(msg) {
            const el = document.getElementById('checkoutError');
            el.textContent = msg;
            el.style.display = 'block';
        }

        async function init() {
            if (!courseId) {
                document.getElementById('checkoutLoading').textContent = 'No course specified.';
                return;
            }

            const { data: { session: s } } = await supabaseClient.auth.getSession();
            session = s;
            if (!session) {
                location.href = `/login.html?next=${encodeURIComponent(location.pathname + location.search)}`;
                return;
            }

            const { data, error } = await supabaseClient
                .from('courses')
                .select('id, title, price, price_usd, thumbnail_url')
                .eq('id', courseId)
                .eq('is_active', true)
                .single();

            if (error || !data) {
                document.getElementById('checkoutLoading').textContent = 'Course not found.';
                return;
            }
            course = data;

            const price = parseFloat(course.price);
            if (!Number.isFinite(price) || price <= 0) {
                // Free course — skip payment UI entirely, enroll directly.
                document.getElementById('checkoutLoading').textContent = 'Enrolling you…';
                try {
                    const res = await fetch('/api/enroll-free', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${session.access_token}`,
                        },
                        body: JSON.stringify({ course_id: courseId }),
                    });
                    const result = await res.json();
                    if (!res.ok) throw new Error(result.error || 'Enrollment failed');
                    location.href = `/course/${courseId}`;
                } catch (err) {
                    document.getElementById('checkoutLoading').textContent = 'Error: ' + err.message;
                }
                return;
            }

            document.getElementById('courseTitle').textContent = course.title;
            updatePriceDisplay();
            document.getElementById('checkoutLoading').style.display = 'none';
            document.getElementById('checkoutBody').style.display = 'block';

            // Hide PayPal option entirely if this course has no USD price set
            const usdPrice = parseFloat(course.price_usd);
            if (!Number.isFinite(usdPrice) || usdPrice <= 0) {
                document.querySelector('.provider-option[data-provider="paypal"]').style.display = 'none';
            }
        }

        function updatePriceDisplay() {
            const provider = selectedProvider();
            const priceEl = document.getElementById('coursePrice');
            if (provider === 'paypal') {
                priceEl.textContent = '$' + parseFloat(course.price_usd).toFixed(2);
            } else {
                priceEl.textContent = '₹' + parseFloat(course.price).toFixed(2);
            }
        }

        async function startPayment() {
            const btn = document.getElementById('payBtn');
            btn.disabled = true;
            btn.textContent = 'Processing…';
            document.getElementById('checkoutError').style.display = 'none';

            const provider = selectedProvider();

            try {
                const res = await fetch('/api/create-order', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${session.access_token}`,
                    },
                    body: JSON.stringify({ course_id: courseId, provider }),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Could not start checkout');

                if (provider === 'razorpay') {
                    const options = {
                        key: data.razorpay_key_id,
                        amount: Math.round(data.amount * 100),
                        currency: data.currency,
                        name: 'Course Purchase',
                        description: course.title,
                        order_id: data.razorpay_order_id,
                        handler: function () {
                            location.href = `/checkout-status.html?order_id=${data.order_id}&provider=razorpay&course_id=${courseId}`;
                        },
                        prefill: { email: session.user.email },
                        theme: { color: '#667eea' },
                        modal: {
                            // If the user closes the widget, still route them to the
                            // status page — verify-order will correctly report "pending".
                            ondismiss: function () {
                                btn.disabled = false;
                                btn.textContent = 'Pay Now';
                            },
                        },
                    };
                    const rzp = new Razorpay(options);
                    rzp.open();
                } else {
                    location.href = data.paypal_approval_url;
                }
            } catch (err) {
                showError(err.message);
                btn.disabled = false;
                btn.textContent = 'Pay Now';
            }
        }

        init();
    </script>
</body>
</html>
